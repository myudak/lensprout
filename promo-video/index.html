<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lensprout promo (16:9)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <!-- Persistent background under every scene. -->
      <div id="el-bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="45" data-track-index="0" data-width="1920" data-height="1080"></div>

      <!-- Scenes alternate tracks 1/2 and overlap by 0.5 s: the outgoing push and incoming entrance are one transition. -->
      <div id="el-s1" data-composition-id="s1-intro" data-composition-src="compositions/s1-intro.html" data-start="0" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s2" data-composition-id="s2-tagline" data-composition-src="compositions/s2-tagline.html" data-start="5.5" data-duration="4.5" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s3" data-composition-id="s3-zoom" data-composition-src="compositions/s3-zoom.html" data-start="9.5" data-duration="6.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s4" data-composition-id="s4-editor" data-composition-src="compositions/s4-editor.html" data-start="15.5" data-duration="5" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s5" data-composition-id="s5-stage3d" data-composition-src="compositions/s5-stage3d.html" data-start="20" data-duration="5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s6" data-composition-id="s6-webcam" data-composition-src="compositions/s6-webcam.html" data-start="24.5" data-duration="5" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s7" data-composition-id="s7-trim" data-composition-src="compositions/s7-trim.html" data-start="29" data-duration="4.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s8" data-composition-id="s8-export" data-composition-src="compositions/s8-export.html" data-start="33" data-duration="4" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s9" data-composition-id="s9-private" data-composition-src="compositions/s9-private.html" data-start="36.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s10" data-composition-id="s10-outro" data-composition-src="compositions/s10-outro.html" data-start="40" data-duration="5" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Synthesized music bed and click sounds (scripts/make-audio.mjs). -->
      <audio id="el-music" src="assets/audio/bed.wav" data-start="0" data-duration="45" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
