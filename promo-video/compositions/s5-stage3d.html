<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s5 .panel {
          position: absolute;
          inset: 0;
          border-radius: 32px;
          overflow: hidden;
          background: var(--aubergine);
          box-shadow: 0 40px 80px -30px rgba(30, 25, 48, 0.6);
        }
        #s5 .aur {
          position: absolute;
          border-radius: 50%;
          filter: blur(60px);
        }
        #s5 .a1 {
          width: 520px;
          height: 420px;
          left: -120px;
          top: -140px;
          background: rgba(232, 106, 71, 0.75);
        }
        #s5 .a2 {
          width: 560px;
          height: 380px;
          right: -160px;
          top: 120px;
          background: rgba(110, 96, 180, 0.8);
        }
        #s5 .a3 {
          width: 480px;
          height: 360px;
          left: 260px;
          bottom: -220px;
          background: rgba(250, 189, 98, 0.6);
        }
        #s5 .persp {
          position: absolute;
          inset: 0;
          perspective: 1700px;
          perspective-origin: 50% 40%;
        }
        #s5 .device {
          position: absolute;
          left: 170px;
          top: 128px;
          width: 660px;
          height: 412px;
          border-radius: 18px;
          overflow: hidden;
          background: #ffffff;
          border: 3px solid rgba(255, 244, 229, 0.85);
          box-shadow: 0 50px 80px -30px rgba(0, 0, 0, 0.65);
        }
        #s5 .device img {
          display: block;
          width: 100%;
          height: 100%;
        }
        #s5 .moves {
          position: absolute;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
          gap: 12px;
        }
        #s5 .moves {
          top: 26px;
        }
        #s5 .chip {
          height: 50px;
          padding: 0 24px;
          border-radius: 25px;
          font: 800 22px/50px var(--font-body);
          color: var(--cream);
          background: rgba(255, 244, 229, 0.12);
          border: 2px solid rgba(255, 244, 229, 0.22);
        }
        #s5 .moves .chip {
          position: relative;
        }
        #s5 .moves .chip .fillon {
          position: absolute;
          inset: -2px;
          border-radius: 25px;
          background: var(--cream);
          opacity: 0;
        }
        #s5 .moves .chip .t {
          position: relative;
        }
      </style>
      <div id="s5" class="scene-root" data-composition-id="s5-stage3d" data-duration="5">
        <div class="scene" data-layout-allow-overlap>
          <div class="copy">
            <div class="kicker">
              <span class="chip-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFF4E5" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z" /><path d="M12 12l8-4.6M12 12L4 7.4M12 12v9.2" /></svg></span>
              3D stage
            </div>
            <h2 class="headline">Give it <span class="hl">depth</span></h2>
            <p class="body">Tilt, orbit, dolly and swing camera moves on a 3D stage, over animated backgrounds.</p>
          </div>
          <div class="stagebox">
            <div class="stage">
              <div class="panel">
                <div class="aur a1"></div>
                <div class="aur a2"></div>
                <div class="aur a3"></div>
                <div class="persp">
                  <div class="device"><img src="assets/demo/range.png" alt="" /></div>
                </div>
                <div class="moves">
                  <div class="chip m1"><span class="fillon"></span><span class="t">Tilt</span></div>
                  <div class="chip m2"><span class="fillon"></span><span class="t">Orbit</span></div>
                  <div class="chip m3"><span class="fillon"></span><span class="t">Dolly</span></div>
                  <div class="chip m4"><span class="fillon"></span><span class="t">Swing</span></div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const q = (s) => "#s5 " + s;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".scene"), { x: 180, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.18);
          tl.fromTo(q(".copy > *"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo(q(".panel"), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);
          // Animated aurora background.
          tl.fromTo(q(".a1"), { x: 0, y: 0 }, { x: 160, y: 90, duration: 4.5, ease: "sine.inOut" }, 0);
          tl.fromTo(q(".a2"), { x: 0, y: 0 }, { x: -140, y: -60, duration: 4.5, ease: "sine.inOut" }, 0);
          tl.fromTo(q(".a3"), { x: 0 }, { x: 180, duration: 4.5, ease: "sine.inOut" }, 0);
          tl.fromTo(q(".moves .chip"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.05, ease: "power2.out" }, 0.45);
          // The screen starts flat-on, then each camera move plays while its chip lights up.
          tl.set(q(".device"), { rotationX: 0, rotationY: 0, z: -220 }, 0);
          const light = (cls, t, d) => {
            tl.to(q(cls + " .fillon"), { opacity: 1, duration: 0.15 }, t);
            tl.to(q(cls + " .t"), { color: "#B94025", duration: 0.15 }, t);
            tl.to(q(cls + " .fillon"), { opacity: 0, duration: 0.2 }, t + d);
            tl.to(q(cls + " .t"), { color: "#FFF4E5", duration: 0.2 }, t + d);
          };
          light(".m1", 0.7, 0.85);
          tl.to(q(".device"), { rotationX: 16, duration: 0.85, ease: "power2.inOut" }, 0.7);
          light(".m2", 1.6, 0.9);
          tl.to(q(".device"), { rotationY: -30, duration: 0.9, ease: "power2.inOut" }, 1.6);
          light(".m3", 2.55, 0.85);
          tl.to(q(".device"), { z: 140, rotationY: -14, duration: 0.85, ease: "power2.inOut" }, 2.55);
          light(".m4", 3.45, 0.9);
          tl.to(q(".device"), { rotationY: 22, rotationZ: -3, duration: 0.95, ease: "back.inOut(1.2)" }, 3.45);
          tl.to(q(".scene"), { x: -180, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, 4.5);
          window.__timelines["s5-stage3d"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
