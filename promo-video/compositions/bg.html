<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--cream);
        }
        #bg-root .dots {
          position: absolute;
          inset: -40px;
          background-image: radial-gradient(rgba(69, 61, 112, 0.13) 2.4px, transparent 2.6px);
          background-size: 44px 44px;
        }
        #bg-root .blob {
          position: absolute;
          border-radius: 50%;
          filter: blur(70px);
        }
        #bg-root .b1 {
          width: 900px;
          height: 900px;
          left: -260px;
          top: -320px;
          background: rgba(250, 189, 98, 0.42);
        }
        #bg-root .b2 {
          width: 820px;
          height: 820px;
          right: -240px;
          bottom: -300px;
          background: rgba(232, 106, 71, 0.26);
        }
        #bg-root .b3 {
          width: 620px;
          height: 620px;
          right: 18%;
          top: -260px;
          background: rgba(166, 191, 160, 0.36);
        }
      </style>
      <div id="bg-root" data-composition-id="bg" data-duration="45">
        <div class="dots"></div>
        <div class="blob b1" data-layout-allow-overflow></div>
        <div class="blob b2" data-layout-allow-overflow></div>
        <div class="blob b3" data-layout-allow-overflow></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Slow ambient drift across the whole film (finite, seek-safe yoyo loops).
        tl.fromTo("#bg-root .b1", { x: 0, y: 0, scale: 1 }, { x: 220, y: 140, scale: 1.12, duration: 9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);
        tl.fromTo("#bg-root .b2", { x: 0, y: 0, scale: 1.1 }, { x: -260, y: -120, scale: 0.95, duration: 11, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo("#bg-root .b3", { x: 0, y: 0 }, { x: -320, y: 160, duration: 7.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
        tl.fromTo("#bg-root .dots", { x: 0, y: 0 }, { x: -44, y: -44, duration: 45, ease: "none" }, 0);
        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
