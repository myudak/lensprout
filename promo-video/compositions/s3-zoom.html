<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* Stage: a recording of the landing site's demo dashboard (assets/demo, scripts/capture-demo.mjs)
           on a procedural background. .cam is the camera. */
        #s3 .frame {
          position: absolute;
          inset: 0;
          border-radius: 32px;
          overflow: hidden;
          box-shadow: 0 40px 80px -30px rgba(69, 61, 112, 0.45);
          background: #f6b98a;
        }
        #s3 .cam {
          position: absolute;
          left: 0;
          top: 0;
          width: 1000px;
          height: 640px;
          transform-origin: 0 0;
        }
        #s3 .wall {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 15% 20%, #fabd62 0, transparent 55%),
            radial-gradient(circle at 85% 85%, #e86a47 0, transparent 60%),
            radial-gradient(circle at 80% 10%, #a6bfa0 0, transparent 50%), #f3a37f;
        }
        /* The recorded page: 1280×800 CSS px shown at 920×575 (scale 0.71875), inset 40/32. */
        #s3 .page {
          position: absolute;
          left: 40px;
          top: 32px;
          width: 920px;
          height: 575px;
          border-radius: 14px;
          overflow: hidden;
          box-shadow: 0 24px 50px -20px rgba(30, 25, 48, 0.5);
          background: #ffffff;
        }
        #s3 .page img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          opacity: 0;
        }
        #s3 .page img.base {
          opacity: 1;
        }
        #s3 .abs {
          position: absolute;
        }
        #s3 .cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 30px;
          height: 30px;
        }
        #s3 .ripple {
          position: absolute;
          left: -30px;
          top: -30px;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          border: 4px solid #e86a47;
          opacity: 0;
        }
        #s3 .badge {
          position: absolute;
          left: 24px;
          top: 24px;
          height: 54px;
          padding: 0 22px 0 16px;
          border-radius: 27px;
          background: var(--purple);
          color: var(--cream);
          font: 800 24px/54px var(--font-body);
          display: flex;
          align-items: center;
          gap: 10px;
        }
        #s3 .badge .val {
          display: inline-block;
          min-width: 64px;
        }
        #s3 .keys {
          position: absolute;
          right: 24px;
          top: 24px;
          display: flex;
          gap: 8px;
        }
        #s3 .keys b {
          display: grid;
          place-items: center;
          width: 54px;
          height: 54px;
          border-radius: 14px;
          background: var(--card);
          border: 3px solid var(--line);
          border-bottom-width: 6px;
          font: 700 26px/1 var(--font-head);
          color: var(--purple);
          opacity: 0;
        }
      </style>
      <div id="s3" class="scene-root" data-composition-id="s3-zoom" data-duration="6.5">
        <div class="scene" data-layout-allow-overlap>
          <div class="copy">
            <div class="kicker">
              <span class="chip-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFF4E5" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L21 21M10.5 7.8v5.4M7.8 10.5h5.4" /></svg></span>
              Automatic zoom
            </div>
            <h2 class="headline">Zoom that <span class="hl">follows</span> you</h2>
            <p class="body">Clicks, long presses and typing turn into smooth, spring-eased zooms. No keyframes.</p>
          </div>
          <div class="stagebox">
            <div class="stage">
              <div class="frame">
                <div class="cam">
                  <div class="wall"></div>
                  <div class="page">
                    <img class="base" src="assets/demo/base.png" alt="" />
                    <img class="st st-range" src="assets/demo/range.png" alt="" />
                    <img class="st st-d0" src="assets/demo/dialog-0.png" alt="" />
                    <img class="st st-d1" src="assets/demo/dialog-1.png" alt="" />
                    <img class="st st-d2" src="assets/demo/dialog-2.png" alt="" />
                    <img class="st st-d3" src="assets/demo/dialog-3.png" alt="" />
                    <img class="st st-d4" src="assets/demo/dialog-4.png" alt="" />
                    <img class="st st-d5" src="assets/demo/dialog-5.png" alt="" />
                    <img class="st st-d6" src="assets/demo/dialog-6.png" alt="" />
                    <img class="st st-d7" src="assets/demo/dialog-7.png" alt="" />
                    <img class="st st-d8" src="assets/demo/dialog-8.png" alt="" />
                    <img class="st st-d9" src="assets/demo/dialog-9.png" alt="" />
                    <img class="st st-d10" src="assets/demo/dialog-10.png" alt="" />
                    <img class="st st-d11" src="assets/demo/dialog-11.png" alt="" />
                  </div>
                  <div class="pointer abs" style="left: 0; top: 0">
                    <div class="ripple"></div>
                    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2.5L19.5 12.6L12.4 13.9L16.3 21.2L13.4 22.6L9.6 15.2L4.3 19.9Z" fill="#1E1930" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" /></svg>
                  </div>
                </div>
                <div class="badge"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FABD62" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L21 21" /></svg><span class="val">1.0×</span></div>
                <div class="keys"><b>J</b><b>a</b><b>n</b><b>e</b></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const q = (s) => "#s3 " + s;
          const tl = gsap.timeline({ paused: true });
          // Page CSS px (1280×800, boxes from assets/demo/targets.json) → recording px.
          const P = (x, y) => [40 + x * 0.71875, 32 + y * 0.71875];
          const TAB = P(853, 338); // "3 months" tab
          const ADD = P(1194, 28); // "New invoice" button
          const NAME = P(470, 339); // Customer name field
          // Camera: show point (px, py) of the 1000×640 recording at the frame center, clamped to its bounds.
          const W = 1000, H = 640;
          const cam = (s, px, py) => ({
            scale: s,
            x: Math.min(0, Math.max(W - W * s, W / 2 - s * px)),
            y: Math.min(0, Math.max(H - H * s, H / 2 - s * py)),
          });
          const badge = q(".badge .val");
          const setZoom = (t, v) => tl.set(badge, { textContent: v }, t);
          const show = (cls, t) => tl.set(q(".page " + cls), { opacity: 1 }, t);
          const click = (t) => {
            tl.to(q(".cursor"), { scale: 0.8, duration: 0.07, transformOrigin: "15% 10%" }, t);
            tl.to(q(".cursor"), { scale: 1, duration: 0.16, ease: "back.out(3)", transformOrigin: "15% 10%" }, t + 0.07);
            tl.fromTo(q(".ripple"), { scale: 0.2, opacity: 0.95 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
          };

          tl.fromTo(q(".scene"), { x: 180, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.18);
          tl.fromTo(q(".copy > *"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo(q(".stagebox"), { y: 60, rotation: 2 }, { y: 0, rotation: 0, duration: 0.8, ease: "back.out(1.4)" }, 0.1);
          tl.set(q(".cam"), cam(1, 500, 320), 0);
          tl.set(q(".ripple"), { opacity: 0 }, 0);
          setZoom(0, "1.0×");

          // 1. Click "3 months": the chart updates and the spring camera pushes in.
          tl.fromTo(q(".pointer"), { x: 560, y: 560 }, { x: TAB[0], y: TAB[1], duration: 0.85, ease: "power3.inOut" }, 0.55);
          click(1.42);
          show(".st-range", 1.48);
          tl.to(q(".cam"), { ...cam(2, TAB[0] - 120, TAB[1] + 50), duration: 0.9, ease: "back.out(1.15)" }, 1.55);
          setZoom(1.7, "2.0×");
          tl.fromTo(q(".badge"), { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 1.65);

          // 2. Cursor heads to "New invoice"; the camera follows.
          tl.to(q(".pointer"), { x: ADD[0], y: ADD[1], duration: 0.75, ease: "power3.inOut" }, 2.55);
          tl.to(q(".cam"), { ...cam(1.8, ADD[0] - 140, ADD[1] + 120), duration: 0.85, ease: "power3.inOut" }, 2.5);
          setZoom(2.9, "1.8×");
          click(3.3);
          show(".st-d0", 3.36);
          // 3. The dialog opens; the camera reframes on the name field and typing follows.
          tl.to(q(".pointer"), { x: NAME[0] + 30, y: NAME[1] + 10, duration: 0.5, ease: "power3.inOut" }, 3.45);
          tl.to(q(".cam"), { ...cam(2.1, NAME[0] + 120, NAME[1] + 20), duration: 0.75, ease: "power3.inOut" }, 3.45);
          setZoom(3.8, "2.1×");
          tl.to(q(".pointer"), { opacity: 0, duration: 0.2 }, 3.95);
          for (let i = 1; i <= 11; i++) show(".st-d" + i, 4.0 + i * 0.07);
          tl.fromTo(q(".keys b"), { opacity: 0, y: 20, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.07 }, 4.07);
          tl.to(q(".keys b"), { opacity: 0, y: -10, duration: 0.25, stagger: 0.05 }, 4.9);
          // 4. Zoom back out to the whole page.
          tl.to(q(".cam"), { ...cam(1, 500, 320), duration: 0.8, ease: "power3.inOut" }, 5.0);
          setZoom(5.35, "1.0×");
          tl.to(q(".scene"), { x: -180, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, 6.0);
          window.__timelines["s3-zoom"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
