<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s7 .tcard {
          position: absolute;
          inset: 20px 0;
          padding: 36px 40px;
        }
        #s7 .top {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        #s7 .dur {
          font: 700 30px/1 var(--font-head);
          color: var(--purple);
          display: flex;
          align-items: center;
          gap: 16px;
        }
        #s7 .dur .old {
          position: relative;
          color: #8a819f;
        }
        #s7 .dur .old::after {
          content: "";
          position: absolute;
          left: -4px;
          right: -4px;
          top: 50%;
          height: 4px;
          background: var(--coral-text);
          transform-origin: 0 50%;
          transform: scaleX(var(--strike, 0));
        }
        #s7 .dur .new {
          color: var(--coral-text);
          display: inline-block;
        }
        #s7 .apply {
          height: 60px;
          padding: 0 28px;
          border-radius: 18px;
          background: var(--coral-text);
          color: var(--cream);
          font: 800 24px/60px var(--font-body);
        }
        #s7 .strip {
          position: absolute;
          left: 40px;
          right: 40px;
          top: 170px;
          height: 300px;
          display: flex;
          justify-content: center;
        }
        #s7 .seg {
          position: relative;
          flex: none;
          height: 300px;
          overflow: hidden;
        }
        #s7 .thumb {
          position: absolute;
          left: 3px;
          right: 3px;
          top: 40px;
          height: 120px;
          border-radius: 14px;
          border: 3px solid var(--line);
          background: #fff url("assets/demo/base.png") 0 0 / auto 260px no-repeat;
        }
        #s7 .dull .thumb {
          filter: grayscale(1) opacity(0.55);
        }
        #s7 .type .thumb {
          background-image: url("assets/demo/dialog-6.png");
        }
        #s7 .wave {
          position: absolute;
          left: 3px;
          right: 3px;
          top: 176px;
          height: 90px;
          display: flex;
          align-items: center;
          gap: 3px;
          overflow: hidden;
        }
        #s7 .wave i {
          flex: none;
          width: 4px;
          border-radius: 2px;
          background: var(--purple-soft);
        }
        #s7 .flag {
          position: absolute;
          left: 3px;
          right: 3px;
          top: 36px;
          height: 234px;
          border-radius: 16px;
          border: 4px dashed var(--coral-text);
          background: repeating-linear-gradient(-45deg, rgba(250, 189, 98, 0.35) 0 12px, rgba(250, 189, 98, 0.1) 12px 24px);
          opacity: 0;
        }
        #s7 .tag {
          position: absolute;
          left: 50%;
          top: 0;
          transform: translateX(-50%);
          white-space: nowrap;
          height: 34px;
          padding: 0 12px;
          border-radius: 10px;
          background: var(--purple);
          color: var(--cream);
          font: 800 17px/34px var(--font-body);
          opacity: 0;
        }
        #s7 .beam {
          position: absolute;
          top: 160px;
          left: 40px;
          width: 6px;
          height: 320px;
          border-radius: 3px;
          background: var(--apricot);
          box-shadow: 0 0 24px 8px rgba(250, 189, 98, 0.6);
          opacity: 0;
        }
      </style>
      <div id="s7" class="scene-root" data-composition-id="s7-trim" data-duration="4.5">
        <div class="scene" data-layout-allow-overlap>
          <div class="copy">
            <div class="kicker">
              <span class="chip-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFF4E5" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="7" r="3" /><circle cx="6" cy="17" r="3" /><path d="M8.5 8.5L20 18M8.5 15.5L20 6" /></svg></span>
              Smart trim
            </div>
            <h2 class="headline">Skip the <span class="hl">boring</span> bits</h2>
            <p class="body">Finds idle stretches, typing and silences, then suggests speed-ups and cuts.</p>
          </div>
          <div class="stagebox">
            <div class="stage">
              <div class="tcard card">
                <div class="top">
                  <div class="dur"><span class="old">02:10</span><svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="#453D70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h27M21 4l9 8-9 8" /></svg><span class="new">01:34</span></div>
                  <div class="apply">Apply suggestions</div>
                </div>
              </div>
              <div class="strip">
                <div class="seg" data-w="184" data-a="1"><div class="thumb"></div><div class="wave"></div></div>
                <div class="seg dull s-idle" data-w="129" data-a="0.08"><div class="thumb"></div><div class="wave"></div><div class="flag"></div><div class="tag">Idle · cut</div></div>
                <div class="seg" data-w="166" data-a="0.9"><div class="thumb"></div><div class="wave"></div></div>
                <div class="seg type s-type" data-w="147" data-a="0.45"><div class="thumb"></div><div class="wave"></div><div class="flag"></div><div class="tag">Typing · 3×</div></div>
                <div class="seg" data-w="147" data-a="0.85"><div class="thumb"></div><div class="wave"></div></div>
                <div class="seg dull s-sil" data-w="147" data-a="0.05"><div class="thumb"></div><div class="wave"></div><div class="flag"></div><div class="tag">Silence · cut</div></div>
              </div>
              <div class="beam"></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const q = (s) => "#s7 " + s;
          const root = document.querySelector("#s7");
          // Deterministic waveform bars per segment (amplitude from data-a).
          let n = 0;
          root.querySelectorAll(".seg").forEach((seg, idx) => {
            const w = +seg.dataset.w;
            // Each thumbnail shows a different crop of the recorded dashboard.
            seg.querySelector(".thumb").style.backgroundPosition = seg.classList.contains("type") ? "-125px -60px" : -idx * 52 + "px " + -(idx % 3) * 40 + "px";
            const a = +seg.dataset.a;
            seg.style.width = w + "px";
            const wave = seg.querySelector(".wave");
            const count = Math.floor((w - 6) / 7);
            for (let i = 0; i < count; i++, n++) {
              const v = 0.35 + 0.65 * Math.abs(Math.sin(n * 0.9) * Math.cos(n * 0.37 + 1.3));
              const bar = document.createElement("i");
              bar.style.height = Math.max(4, Math.round(84 * a * v)) + "px";
              wave.appendChild(bar);
            }
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".scene"), { x: 180, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.18);
          tl.fromTo(q(".copy > *"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.15);
          tl.fromTo(q(".tcard"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.05);
          tl.fromTo(q(".seg"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.06 }, 0.2);
          tl.fromTo(q(".dur"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
          tl.set(q(".dur .new"), { opacity: 0 }, 0);
          // Scanner sweeps the recording and flags each stretch as it passes.
          tl.fromTo(q(".beam"), { x: 0, opacity: 0 }, { x: 910, opacity: 1, duration: 1.3, ease: "power1.inOut" }, 0.6);
          tl.to(q(".beam"), { opacity: 0, duration: 0.2 }, 1.85);
          const flag = (cls, t) => {
            tl.fromTo(q(cls + " .flag"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
            tl.fromTo(q(cls + " .tag"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t + 0.05);
          };
          flag(".s-idle", 0.85);
          flag(".s-type", 1.25);
          flag(".s-sil", 1.7);
          // Apply: cuts collapse, typing speeds up 3×, the strip tightens.
          tl.to(q(".apply"), { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 2.15);
          tl.to(q(".s-idle"), { width: 0, duration: 0.55, ease: "power3.inOut" }, 2.3);
          tl.to(q(".s-sil"), { width: 0, duration: 0.55, ease: "power3.inOut" }, 2.38);
          tl.to(q(".s-type"), { width: 64, duration: 0.55, ease: "power3.inOut" }, 2.46);
          tl.to(q(".s-type .tag"), { opacity: 0, duration: 0.2 }, 2.46);
          tl.to(q(".dur .old"), { "--strike": 1, duration: 0.3, ease: "power2.out" }, 2.4);
          tl.fromTo(q(".dur .new"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)", immediateRender: false }, 2.65);
          tl.to(q(".scene"), { x: -180, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, 4.0);
          window.__timelines["s7-trim"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
